# پذیرشِ گویندهٔ تازه — نیمهٔ بیرونیِ بخشِ ۳۳
#
# ══ تقسیمِ کار ══
# موتور پوشهٔ «voice cloning» را می‌خوانَد و `_VOICE-QUEUE.json` را در
# درایو می‌نویسد. این گردش‌کار آن صف را برمی‌دارد، برای هر گوینده یک
# گام جلو می‌رود، و حالت را در `docs/voices.json` می‌نویسد — جایی که
# موتور با gitHub raw می‌خوانَدش، همان راهی که `engine.gs` هر شب از آن
# می‌آید. هیچ رمزی جز `GITHUB_TOKEN` لازم نیست: فایل‌های صوتی را موتور
# موقتاً «هرکس با لینک» می‌کند و بعد اشتراکشان را پس می‌گیرد.
#
# ══ چرا دو job ══
# `plan` ارزان است (چند فراخوانِ API) و باید هر شش ساعت بدود. `measure`
# گران است (دانلودِ مدل، تبدیل، مدلِ گوینده) و فقط وقتی لازم است که
# گوینده‌ای واقعاً به گامِ سنجش رسیده باشد. یکی‌کردنشان یعنی هر اجرا
# نیم‌ساعت طول بکشد تا در ۹۵٪ مواقع هیچ کاری نکند.
#
# ══ و کاری که اینجا انجام **نمی‌شود** ══
# هیچ صدایی روی هیچ قسمتی نمی‌نشیند. «پلِ رنگِ صدا» کارِ این نیست.

name: voice-intake

on:
  schedule:
    # هر شش ساعت، دقیقهٔ ۵۰ — بعد از کارِ شبانهٔ موتور (۰۲:۳۰ دبی) و دور
    # از رندرِ ویدئو (دقیقهٔ ۴۰) و غنی‌سازی (دقیقهٔ ۲۰).
    - cron: '50 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write        # برای راه‌انداختنِ voice-train و خواندنِ artifactها

concurrency:
  # دو اجرای هم‌زمان یعنی دو بار راه‌انداختنِ یک آموزش و برخورد روی
  # docs/voices.json. آموزشِ خودِ گویندگان همچنان موازی است — گروهِ آن
  # در voice-train.yml به کلیدِ گوینده بسته است، نه به این.
  group: voice-intake
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      measure: ${{ steps.plan.outputs.measure }}
      style: ${{ steps.plan.outputs.style }}
    steps:
      - uses: actions/checkout@v5

      - name: یک گام برای هر گوینده
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # شناسهٔ ثابتِ صف — همان که در src/00_Config.gs زیرِ
          # VOICE_QUEUE_ID نشسته. اگر یکی عوض شد و دیگری نه، موتور خودش
          # داد می‌زند (`vintQueueIdOk_`)، چون سکوتِ این دو تا ابد ادامه
          # پیدا می‌کرد.
          VOICE_QUEUE_ID: '1NoVT_J1-KQ_e4fyhc4VqbDf3Xy0FcZH5'
          VI_EPOCHS: '32'
        run: python3 tools/voiceintake.py --plan

      - name: ثبتِ حالت در ریپو
        if: steps.plan.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/voices.json; then
            echo "چیزی عوض نشد."; exit 0
          fi
          git config user.name  "content-engine-voice"
          git config user.email "actions@users.noreply.github.com"
          git add docs/voices.json
          git commit -m "گویندگان: یک گام جلو"
          # ══ بی abort، تلاشِ دوم اصلاً تلاش نیست ══
          # rebaseی که تضاد بخورد، درخت را نیمه‌ادغام رها می‌کند و
          # `git pull` بعدی با «Pulling is not possible because you have
          # unmerged files» می‌افتد — یعنی سه تلاشِ بعدی برای دلیلی
          # کاملاً دیگر شکست می‌خورند و پیامِ گمراه‌کننده چاپ می‌شود.
          # حلقه‌ای که نمی‌تواند دوباره تلاش کند، همان شکلِ `removeTriggers`
          # است: چیزی که می‌گوید کاری می‌کند و نمی‌کند.
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((i * 3))
          done
          git rebase --abort 2>/dev/null || true
          echo "::error title=ثبت نشد::پس از چهار تلاش، نتیجه در ریپو ثبت نشد."
          exit 1

  # ══ «روحِ خواندن» — کارِ سومی که به مدل کاری ندارد ══
  # صاحبِ برنامه هر دو را خواست: «روح و رنگش رو کلون کنی». رنگ کارِ
  # RVC است؛ روح — مکث و کشش و ریتم — **خروجیِ** آن نیست، **ورودی**‌اش
  # است و از خوانشِ جمینای می‌آید. پس جداگانه از ضبط‌های خودِ او
  # اندازه گرفته می‌شود و به‌صورتِ دستور به جمینای داده می‌شود.
  #
  # ══ چرا job سوم و نه داخلِ measure ══
  # `measure` مدل می‌خواهد و ساعت‌ها پشتِ آموزش می‌مانَد. کارتِ سبک
  # هیچ‌کدام را لازم ندارد — و اگر به آن گره می‌خورد، گوینده‌ای که
  # آموزشش شکست بخورد روحش هم هرگز ثبت نمی‌شد. یک شکست نباید دو
  # قابلیت را ببرد.
  style:
    needs: plan
    if: success() && needs.plan.outputs.style != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ffmpeg
        run: |
          set -euo pipefail
          python3 -m pip install --quiet imageio-ffmpeg
          FF="$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p "$HOME/.local/bin"; ln -sf "$FF" "$HOME/.local/bin/ffmpeg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: کتابخانه‌ها
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "librosa>=0.10.2,<0.11" \
            "soundfile>=0.13.0,<1" "silero-vad>=5,<6" "numpy<2" \
            "torch" "torchaudio" gdown

      # ══ چند ضبط، نه یکی ══
      # پنجرهٔ حالت‌ها ربعِ ساعت است و تنوعِ لحن بیشتر بینِ ضبط‌هاست تا
      # داخلِ یکی. یک فایل کارت می‌سازد ولی «نمونه کم» می‌خورَد.
      - name: ضبط‌های خودِ گوینده
        env:
          KEY: ${{ needs.plan.outputs.style }}
        run: |
          set -euo pipefail
          mkdir -p refs
          n=0
          for ID in $(python3 tools/voiceintake.py --refids "$KEY" 6); do
            n=$((n+1))
            python3 -m gdown "$ID" -O "refs/r$n.audio" || \
              python3 -m gdown --fuzzy "https://drive.google.com/uc?id=$ID" \
                -O "refs/r$n.audio" || { echo "::warning::$ID برداشته نشد"; rm -f "refs/r$n.audio"; }
          done
          ls -la refs/
          # ══ هیچ فایلی ⇒ قرمز، نه کارتِ خالی ══
          # کارتی که از هیچ ساخته شود، عددهایش را از پیش‌فرض‌ها می‌گیرد
          # و شبیهِ اندازه‌گیری به نظر می‌رسد. آن بدتر از نبودنش است.
          [ -n "$(ls -A refs/ 2>/dev/null)" ] || \
            { echo "::error title=ضبطی برداشته نشد::اشتراکِ فایل‌ها را وارسی کن."; exit 1; }

      - name: اندازه‌گیریِ سبک
        env:
          KEY: ${{ needs.plan.outputs.style }}
        run: |
          set -euo pipefail
          ARGS=(--engine style --out lab --style-name "$KEY")
          for f in refs/*.audio; do ARGS+=(--ref "$f"); done
          python3 tools/voicelab.py "${ARGS[@]}"
          python3 tools/voiceintake.py --style "$KEY" lab

      - name: ثبتِ نتیجه
        run: |
          set -euo pipefail
          mkdir -p docs/voice-style
          cp lab/STYLE-*.md "docs/voice-style/" 2>/dev/null || true
          git config user.name  "content-engine-voice"
          git config user.email "actions@users.noreply.github.com"
          git add docs/voices.json docs/voice-style || true
          git diff --cached --quiet && { echo "چیزی عوض نشد."; exit 0; }
          git commit -m "گویندگان: کارتِ سبک"
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((i * 3))
          done
          git rebase --abort 2>/dev/null || true
          echo "::error title=ثبت نشد::پس از چهار تلاش، کارتِ سبک در ریپو ثبت نشد."
          exit 1

  measure:
    needs: plan
    # ══ `success()` باید صریح نوشته شود ══
    # هر job که `if:` خودش را دارد، `success()`ِ ضمنی روی `needs` را از
    # دست می‌دهد. بی این، `plan`ی که سرِ push مرده باشد باز هم اجازه
    # می‌داد `measure` روی درختِ کهنه بدود.
    if: success() && needs.plan.outputs.measure != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ══ شاخه، نه commitِ راه‌انداز (۷٫۲۲) ══
      # `checkout` پیش‌فرض `github.sha` را می‌گیرد — یعنی commitی که این
      # اجرا را راه انداخت، **پیش از** pushِ خودِ `plan`. بعد `measure`
      # روی همان درختِ کهنه `docs/voices.json` را می‌نوشت و همیشه — نه
      # گاهی — با کارِ `plan` تضاد می‌گرفت. و «چهار بار با مکث دوباره
      # امتحان کن» برای تضادی که قطعی است هیچ کاری نمی‌کند.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ffmpeg
        run: |
          set -euo pipefail
          python3 -m pip install --quiet imageio-ffmpeg
          FF="$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FF" -version | head -1
          mkdir -p "$HOME/.local/bin"; ln -sf "$FF" "$HOME/.local/bin/ffmpeg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ══ مدل از artifactِ همان اجرای آموزش ══
      # نامِ فایل‌ها از خودِ پوشه خوانده می‌شود، نه از فهرستی دستی — همان
      # درسی که `removeTriggers` در موتور داد: فهرستِ دست‌نویسِ آنچه کد
      # می‌سازد، کهنه می‌شود.
      - name: مدلِ گویندهٔ تازه
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY: ${{ needs.plan.outputs.measure }}
        run: |
          set -euo pipefail
          RID="$(python3 tools/voiceintake.py --runid "$KEY")"
          [ -n "$RID" ] || { echo "::error::اجرای آموزشِ $KEY ثبت نشده."; exit 1; }
          gh run download "$RID" -R "$GITHUB_REPOSITORY" -n "voice-$KEY" -D vart
          M="$(find vart -name '*.pth' ! -name '*_e*' | head -1)"
          [ -n "$M" ] || M="$(find vart -name '*.pth' | sort -V | tail -1)"
          I="$(find vart -name '*.index' | head -1)"
          if [ -z "$M" ]; then
            echo "::error::در artifactِ اجرای $RID هیچ .pth نبود."
            find vart -type f | head -20; exit 1
          fi
          cp "$M" model.pth
          [ -n "$I" ] && cp "$I" model.index || echo "بی ایندکس ادامه می‌دهیم."

      - name: کتابخانه‌ها
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "infer-rvc-python>=1.3.1,<2" \
            "soundfile>=0.13.0,<1" "speechbrain>=1.0,<2" "silero-vad>=5,<6" \
            "numpy<2" "torch" "torchaudio" gdown

      # ══ مرجع و مبدأ: همان دو فایلی که رضوی با آن‌ها سنجیده شد ══
      # سنجش فقط وقتی معنا دارد که ورودی‌اش ثابت باشد. عددِ ۰٫۷۴۴ِ رضوی
      # روی همین دو فایل گرفته شد، پس هر گویندهٔ تازه هم با همین‌ها
      # سنجیده می‌شود و عددها با هم قابلِ مقایسه‌اند. ورودیِ متغیر یعنی
      # عددی که با هیچ عددِ دیگری جور نیست.
      # ══ مرجع، صدای **خودِ همین گوینده** است ══
      # نسخهٔ اول `--ref` را اصلاً نمی‌فرستاد (که در voicelab اجباری است،
      # پس هر اجرا قرمز می‌شد) و در کامنتش نوشته بود مرجع را ثابت نگه
      # می‌داریم تا عددها قابلِ مقایسه باشند. **غلط بود**: `rvcSim_`
      # کسینوسِ (خروجی، مرجع) است، یعنی مرجع همان هویتی است که سنجیده
      # می‌شود. سنجیدنِ کلونِ یک گویندهٔ تازه در برابرِ ضبطِ رضوی هیچ
      # معنایی ندارد. **مبدأ** ثابت می‌ماند (همان صوتِ جمینای)، مرجع نه.
      - name: مرجع و مبدأ
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY: ${{ needs.plan.outputs.measure }}
        run: |
          set -euo pipefail
          REF_ID="$(python3 tools/voiceintake.py --refid "$KEY")"
          if [ -z "$REF_ID" ]; then
            echo "::error title=مرجع نیست::برای «$KEY» هیچ فایلِ نمونه‌ای ثبت نشده، پس شباهت با چیزی سنجیده نمی‌شود."
            exit 1
          fi
          python3 -m pip install --quiet gdown
          python3 -m gdown "$REF_ID" -O ref.wav || \
            python3 -m gdown --fuzzy "https://drive.google.com/uc?id=$REF_ID" -O ref.wav
          python3 -m gdown "1v4HaKFw7_7sD5pe2UE199iFX69jgh2p0" -O src.wav || \
            python3 -m gdown --fuzzy "https://drive.google.com/uc?id=1v4HaKFw7_7sD5pe2UE199iFX69jgh2p0" -O src.wav
          ls -la ref.wav src.wav

      - name: تبدیل و سنجشِ شباهت
        id: sim
        env:
          KEY: ${{ needs.plan.outputs.measure }}
        run: |
          set -euo pipefail
          ARGS=(--engine rvc --ref ref.wav --src src.wav --out lab --rvc-model model.pth)
          if [ -f model.index ]; then ARGS+=(--rvc-index model.index); fi
          ARGS+=(--rvc-pitch -12 --rvc-index-rate 1.0 --rvc-protect 0.33)
          # ══ خروجی را بلعیدن ممنوع ══
          # نسخهٔ اول `|| echo "::warning::"` داشت، و چون `cp src.wav …`
          # بعدش همیشه موفق بود، پوشهٔ نمونه‌ها خالی نمی‌ماند و گوینده
          # «آماده» ثبت می‌شد — با نمونه‌ای که **صوتِ تبدیل‌نشده** بود و
          # یک «✅ آماده» به ایمیل و تلگرام. یعنی دقیقاً همان «کسی به
          # خروجی گوش نداد» که CLAUDE.md یک بخش دربارهٔ آن دارد.
          python3 tools/voicelab.py "${ARGS[@]}"
          mkdir -p "docs/voice-samples/$KEY"
          n=0
          for f in $(find lab -name 'rvc-*.wav' | sort | head -3); do
            n=$((n+1)); cp "$f" "docs/voice-samples/$KEY/نمونه-$n.wav"
          done
          if [ "$n" -eq 0 ]; then
            echo "::error title=نمونه‌ای ساخته نشد::تبدیل خروجی نداد؛ «آماده» ثبت نمی‌شود."
            exit 1
          fi
          cp src.wav "docs/voice-samples/$KEY/پیش-از-تبدیل.wav"
          S="$(python3 tools/voiceintake.py --sim lab)"
          echo "قدرِ شباهت: ${S:-—}"
          echo "sim=$S" >> "$GITHUB_OUTPUT"

      - name: ثبتِ نتیجه
        env:
          KEY: ${{ needs.plan.outputs.measure }}
          # از راهِ محیط، نه درج در متنِ فرمان. مقدارش از یک فایلِ JSON
          # می‌آید که voicelab نوشته؛ درجِ مستقیم یعنی هر چیزی که آنجا
          # بنشیند در پوسته اجرا می‌شود.
          SIM: ${{ steps.sim.outputs.sim }}
        run: |
          set -euo pipefail
          python3 tools/voiceintake.py --record "$KEY" "$SIM" \
            "مدل آموزش دید و سنجیده شد."
          git config user.name  "content-engine-voice"
          git config user.email "actions@users.noreply.github.com"
          git add docs/voices.json "docs/voice-samples/$KEY" || true
          git diff --cached --quiet && { echo "چیزی عوض نشد."; exit 0; }
          git commit -m "گویندگان: «$KEY» سنجیده شد"
          # ══ بی abort، تلاشِ دوم اصلاً تلاش نیست ══
          # rebaseی که تضاد بخورد، درخت را نیمه‌ادغام رها می‌کند و
          # `git pull` بعدی با «Pulling is not possible because you have
          # unmerged files» می‌افتد — یعنی سه تلاشِ بعدی برای دلیلی
          # کاملاً دیگر شکست می‌خورند و پیامِ گمراه‌کننده چاپ می‌شود.
          # حلقه‌ای که نمی‌تواند دوباره تلاش کند، همان شکلِ `removeTriggers`
          # است: چیزی که می‌گوید کاری می‌کند و نمی‌کند.
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((i * 3))
          done
          git rebase --abort 2>/dev/null || true
          echo "::error title=ثبت نشد::پس از چهار تلاش، نتیجه در ریپو ثبت نشد."
          exit 1
