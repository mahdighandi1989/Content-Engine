# ══ آینهٔ وابستگی‌های بیرونی ══
#
# مدلِ صدا مالِ ماست، ولی اجرایش به سه چیز بند است که مالِ ما نیستند:
# بستهٔ `infer-rvc-python` (نگه‌داریِ یک نفر روی PyPI)، و ContentVec و
# RMVPE از یک مخزنِ شخصیِ Hugging Face. اگر فردا پاک شوند، مدلِ ما سالم
# است و اجرا نمی‌شود — و تا آن روز نامرئی است.
#
# این گردش‌کار همه‌شان را می‌آورد، اثرانگشت می‌گیرد، **نصبِ آفلاین را
# امتحان می‌کند**، و قفل را در خودِ مخزن می‌نویسد. قفل کوچک است و برای
# همیشه در گیت می‌مانَد؛ خودِ فایل‌ها را شما یک بار برمی‌دارید و کنارِ
# مدل در درایو می‌گذارید.
name: voice-mirror

on:
  workflow_dispatch:
    inputs:
      train:
        description: 'وابستگی‌های آموزشِ دوباره هم برداشته شود؟ (بزرگ‌تر می‌شود)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: voice-mirror
  cancel-in-progress: false

permissions:
  contents: write        # فقط برای نوشتنِ قفل روی main

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ══ جا باز کن ══
      # خانوادهٔ torch دو و نیم گیگابایت است و **دانلود** می‌شود (تا
      # کامل بودنِ بقیه ثابت شود) هرچند فرستاده نمی‌شود.
      - name: جا باز کن
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / | tail -1

      - name: ابزارِ دانلود
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "huggingface_hub[cli]>=0.34,<1.0"

      - name: ساختِ آینه
        env:
          WANT_TRAIN: ${{ inputs.train }}
        run: |
          set -euo pipefail
          ARGS=(pack --out mirror)
          if [ "${WANT_TRAIN}" = "true" ]; then ARGS+=(--train); fi
          python3 tools/mirror.py "${ARGS[@]}"

      # ══ و همان قفل، روی همان آینه، سنجیده شود ══
      # نوشتنِ اثرانگشت و سنجیدنش دو کارند. اگر فقط بنویسیم، هیچ‌وقت
      # نمی‌فهمیم سنجش کار می‌کند یا نه — و روزی که لازم شود، همان
      # روزی است که نباید امتحانش کنیم.
      - name: سنجشِ آینه با قفلِ خودش
        run: python3 tools/mirror.py verify mirror

      - name: چکیده
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import io, json
          lk = json.loads(io.open('tools/mirror_lock.json', encoding='utf-8').read())
          print('### آینهٔ وابستگی‌ها\n')
          print('| | |')
          print('|---|---|')
          print('| فایل‌ها | %d |' % len(lk['files']))
          print('| حجم | %.1f مگابایت |' % (lk['total_bytes'] / 1048576.0))
          print('| نصبِ آفلاین | %s |' % ('✅ آزموده شد' if lk['offline_install_ok'] else '❌'))
          print('| وزن‌ها | `%s` @ `%s` |' % (lk['weights']['repo'], (lk['weights']['revision'] or '?')[:12]))
          print('| بیرون گذاشته شد | %d چرخِ خانوادهٔ torch |' % len(lk['wheels']['excluded']))
          print('\n**بزرگ‌ترین فایل‌ها**\n')
          for f in sorted(lk['files'], key=lambda x: -x['bytes'])[:12]:
              print('- `%s` — %.1f مگابایت' % (f['path'], f['bytes'] / 1048576.0))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: voice-mirror
          path: mirror/
          retention-days: 90
          if-no-files-found: error

      # ══ قفل در گیت می‌مانَد، فایل‌ها نه ══
      # artifact نودی روز بیشتر نمی‌مانَد؛ آینه چیزی است که شما در
      # درایو نگه می‌دارید. ولی «دقیقاً چه چیزی را آینه کردیم» باید
      # برای همیشه بماند، وگرنه آینهٔ بی‌شناسنامه داریم.
      - name: قفل را در مخزن نگه دار
        run: |
          set -euo pipefail
          # ══ `git diff` فایلِ ردگیری‌نشده را نمی‌بیند ══
          # اجرای دوم موفق شد، این مرحله «قفل عوض نشده» گفت و هیچ
          # نکرد — چون قفل **تازه** بود و هرگز در گیت نبوده، و
          # `git diff --quiet -- <untracked>` صفر برمی‌گرداند. یعنی
          # مرحله‌ای که کارش نگه داشتنِ شناسنامه بود، سبز تمام شد و
          # شناسنامه‌ای نگه نداشت. `git status --porcelain` هم
          # تغییر را می‌بیند هم فایلِ تازه را.
          if [ -z "$(git status --porcelain -- tools/mirror_lock.json)" ]; then
            echo "قفل عوض نشده"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/mirror_lock.json
          git commit -m "آینه: قفلِ وابستگی‌های بیرونی به‌روز شد"
          git push
