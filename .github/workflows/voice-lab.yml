# آزمایشگاهِ صدا — گامِ صفرِ «شبیه‌سازیِ صدا»
#
# چرا اینجا و نه در خودِ موتور: Apps Script نه پایتون دارد، نه GPU، نه
# مهلتِ کافی — و مهم‌تر از همه، `ttsPayloads_` فقط یک **نامِ** صدا به Gemini
# می‌فرستد و هیچ فیلدی برای نمونهٔ صوتی ندارد. پس اگر قرار است صدای کسی
# ساخته شود، مدلِ دیگری باید بسازدش. اینجا همان ماشینی است که رندرِ ویدئو
# روی آن اجرا می‌شود: شبکهٔ باز، پایتون، و پنجاه دقیقه وقت.
#
# این گردش‌کار **دستی** است و هیچ زمان‌بندی ندارد: یک آزمایش است، نه یک
# قابلیت. تا وقتی جوابش را نشنویم، یک خط از موتور دست نمی‌خورد.
#
# ── پیش از اجرا ──
# هر دو فایلِ درایو باید موقتاً «هرکس با لینک: بیننده» باشند — همان کاری که
# مسیرِ رندرِ ویدئو هر ساعت خودکار می‌کند. بعد از اجرا اشتراک را پس بگیرید.

name: voice-lab

on:
  workflow_dispatch:
    inputs:
      engine:
        description: 'کدام موتور (all = همه، موازی · chatterboxvc = بهترین شانس)'
        required: true
        default: all
        type: choice
        options: [all, chatterboxvc, seedvc, chatterbox, f5, xtts, فقط-اسکن]
      ref_id:
        description: 'شناسهٔ فایلِ درایو — نمونهٔ صدای گوینده'
        required: true
        type: string
      src_id:
        description: 'شناسهٔ فایلِ درایو — یک wavِ فارسیِ Gemini (فقط برای seedvc)'
        required: false
        default: ''
        type: string
      text:
        description: 'متنِ آزمون (خالی = جملهٔ اعراب‌دارِ پیش‌فرض)'
        required: false
        default: ''
        type: string
      # وقتی کارِ scan چک‌پوینتِ فارسیِ f5 را پیدا کرد، شناسه‌اش را اینجا
      # بگذارید — بی هیچ تغییرِ کد. مثال:
      #   hf://<کاربر>/<مخزن>/model_last.safetensors
      f5_ckpt:
        description: 'چک‌پوینتِ f5 — شناسهٔ مخزن بس است، مثل Lumos675/F5_TTS_Persian'
        required: false
        default: ''
        type: string
      f5_vocab:
        description: 'واژگانِ سفارشیِ f5 (hf://… یا خالی)'
        required: false
        default: ''
        type: string
      # از اجرای #۱۰ خالی‌گذاشتن هم امن است: رونویس را خودمان با زبانِ
      # صریحِ فارسی می‌گیریم و **همان** را به f5 پاس می‌دهیم، از روی همان
      # فایلی که واقعاً به مدل می‌رود (reference-used.wav). ولی اگر خودتان
      # بنویسیدش، حتماً بهتر است.
      f5_ref_text:
        description: 'متنِ دقیقِ نمونهٔ صدا (از روی reference-used.wav) — خالی یعنی رونویسِ خودکارِ فارسی'
        required: false
        default: ''
        type: string
      # از ۳۰ ثانیه، خودِ f5 سرِ نزدیک‌ترین مکث زیرِ ۱۲ ثانیه می‌بُرد
      # (cutAtPause_). پس این عدد «چقدر مواد بده»، نه «چقدر استفاده کن».
      ref_seconds:
        description: 'چند ثانیه از نمونه برداشته شود (برشِ نهایی خودکار سرِ مکث، زیرِ ۱۲ ثانیه)'
        required: false
        default: '30'
        type: string
      f5_nfe:
        description: 'گام‌های کیفیتِ f5 — خالی=۳۲ · ۶۴ بهتر و کندتر (سقفِ زمان حالا ۱۵۰ دقیقه است)'
        required: false
        default: ''
        type: string
      mirror_repo:
        description: 'نسخهٔ پشتیبان از یک مخزنِ Hugging Face (شناسه، یا خالی)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: voice-lab
  cancel-in-progress: false

jobs:
  # ══ چرا دو کار و نه یکی ══
  # اجرای اول ۲م۴۷ث طول کشید. وقتی هر آزمایش این‌قدر ارزان است، «یکی‌یکی
  # امتحان کن و هر بار برگرد» گران‌ترین بخشِ کار می‌شود — وقتِ آدم، نه وقتِ
  # ماشین. با ماتریس، یک دکمه هر چهار جواب را می‌دهد و هر کدام رانرِ خودش
  # و پنجاه دقیقهٔ خودش را دارد.
  plan:
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.pick.outputs.engines }}
    steps:
      - id: pick
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          set -euo pipefail
          # ══ چرا «فقط اسکن» یک گزینه شد ══
          # کارِ scan یک دقیقه است و کارِ سنگین یک ساعت. وقتی سؤال «آیا این
          # مخزن اصلاً فایلِ به‌دردبخوری دارد؟» است، یک ساعت صبرکردن برای
          # جوابی که یک فهرست می‌دهد، همان اشتباهِ اجرای #۹ است با شکلِ دیگر.
          if [ "$ENGINE" = "فقط-اسکن" ]; then
            echo 'engines=[]' >> "$GITHUB_OUTPUT"
          elif [ "$ENGINE" = "all" ]; then
            # اسکنِ اجرای #۶ و عددهای سرعت، دو موتور را از دور خارج کردند:
            #  • xtts — نه فارسی دارد نه وزنِ تجاری
            #  • seedvc — ۱۲۵ برابرِ بلادرنگ، یعنی ۴۰ ساعت برای یک قسمت
            # هنوز با انتخابِ صریح اجرا می‌شوند؛ فقط در «همه» نمی‌آیند.
            echo 'engines=["f5","chatterboxvc","chatterbox"]' >> "$GITHUB_OUTPUT"
          else
            echo "engines=[\"$ENGINE\"]" >> "$GITHUB_OUTPUT"
          fi

  # ══ «آیا اصلاً مدلی برای فارسی هست؟» ══
  # پس از پنج اجرا قطعی شد که هیچ چک‌پوینتِ **پایه‌ای** فارسی نمی‌داند. ولی
  # f5-tts آرگومانِ --ckpt_file دارد: می‌شود چک‌پوینتِ دیگری به آن داد. اگر
  # کسی f5 را روی فارسی تنظیمِ دقیق کرده باشد، هم فارسی داریم هم کلونِ صدا.
  # جوابِ «نمی‌دانم» را نباید حدس زد وقتی می‌شود پرسید — و شبکهٔ این ماشین
  # باز است. چند ثانیه، بی هیچ دانلودی.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # ══ پیش از هر کارِ سنگین، کدِ خودم را بسنج ══
      # اجرای #۴ و #۶ هر دو باگِ خودم بودند و چهل دقیقه بعد پیدا شدند.
      # این دو ثانیه طول می‌کشد و همان دو شکل را جلوتر می‌گیرد.
      - name: خودآزمونِ منطقِ آزمایشگاه
        run: python3 tools/voicelab_selftest.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: نقشهٔ مدل‌های فارسی و ممیزیِ واژگان
        env:
          F5_CKPT: ${{ inputs.f5_ckpt }}
          F5_VOCAB: ${{ inputs.f5_vocab }}
          LAB_TEXT: ${{ inputs.text }}
        run: python3 tools/voicescan.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voicescan
          path: voicescan.json
          retention-days: 7
          if-no-files-found: warn

  # ══ «اگر صاحبِ مخزن خصوصی‌اش کند چه؟» ══
  # سؤالِ درستی است و جوابش «امیدواریم نکند» نیست. مخزنِ
  # Lumos675/F5_TTS_Persian صفر دانلود و صفر لایک دارد — یعنی یک نفر، یک
  # روز، بی هیچ تعهدی. اگر فردا برداشته شود و ما نسخه‌ای نداشته باشیم،
  # همهٔ این کار از دست می‌رود.
  #
  # پس یک بار برمی‌داریمش. خروجی به‌عنوان artifact می‌آید و شما در درایوِ
  # خودتان نگهش می‌دارید — نه در این ریپو، که عمومی است و وزنِ مدلِ کسِ
  # دیگری در آن جایی ندارد.
  mirror:
    if: inputs.mirror_repo != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: برداشتنِ نسخه
        env:
          REPO: ${{ inputs.mirror_repo }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "huggingface_hub[cli]"
          mkdir -p mirror
          hf download "$REPO" --local-dir "mirror/$REPO"
          echo "### نسخهٔ پشتیبانِ \`$REPO\`" >> "$GITHUB_STEP_SUMMARY"
          du -sh "mirror/$REPO" >> "$GITHUB_STEP_SUMMARY"
          find mirror -type f -printf '%s\t%p\n' | sort -rn | head -30 \
            >> "$GITHUB_STEP_SUMMARY"
      # ══ چرا ۵٫۴ گیگ، و چرا لازم نیست ══
      # `model_last.pt` یک چک‌پوینتِ **کاملِ آموزش** است: وزن‌ها + حالتِ
      # بهینه‌ساز + گرادیان‌ها. برای *استفاده* فقط وزن‌های EMA لازم است، که
      # کسری از آن است. نسخهٔ لاغر هم ساخته می‌شود تا در درایو جا بگیرد.
      # ══ چرا ۵٫۴ گیگ، و چرا لازم نیست ══
      # `model_last.pt` یک چک‌پوینتِ **کاملِ آموزش** است: وزن‌ها + حالتِ
      # بهینه‌ساز + شمارندهٔ گام. برای *استفاده* فقط وزن‌های EMA لازم است،
      # که کسری از آن است.
      - name: نسخهٔ لاغر (فقط وزن‌ها)
        env:
          REPO: ${{ inputs.mirror_repo }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python3 tools/slim_ckpt.py "mirror/$REPO/model_last.pt"
          du -sh "mirror/$REPO" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: mirror
          path: mirror/
          retention-days: 5
          if-no-files-found: error

  lab:
    needs: plan
    runs-on: ubuntu-latest
    # ══ چرا ۵۰ شد ۱۵۰ ══
    # اجرای #۹ سرِ پنجاه دقیقه لغو شد و هیچ تشخیصی به دست نیامد. آن عدد
    # را از گردش‌کارِ رندرِ ویدئو کپی کرده بودم، جایی که هر ساعت اجرا
    # می‌شود و کوتاه‌ماندن معنا دارد. این یکی **دستی** است و ماهی چند بار.
    # ریپو عمومی است، پس دقیقهٔ رانر رایگان است و سقفِ خودِ گیت‌هاب شش
    # ساعت. یعنی آن پنجاه دقیقه هیچ‌چیز را صرفه‌جویی نمی‌کرد و فقط
    # آزمایش‌ها را نصفه می‌گذاشت.
    timeout-minutes: 150
    strategy:
      # شکستِ یکی نباید بقیه را لغو کند — شکستِ هر موتور خودش یک جوابِ
      # جداست، نه خرابیِ آزمایش.
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ubuntu-latest دیگر ffmpeg ندارد. باینریِ استاتیکِ PyPI در چند ثانیه
      # می‌آید و به sudo هم نیازی ندارد. (همان راهِ tools/render.js)
      # ══ یک علتِ ریشه‌ای، دو شکستِ ظاهراً بی‌ربط (اجرای #۳) ══
      #
      # f5 افتاد با: «libavutil.so.56: cannot open shared object file»
      # seedvc تبدیل را ۲۶ دقیقه انجام داد و سرِ **ذخیره** افتاد با:
      #         «TorchCodec is required for save_with_torchcodec»
      #
      # هر دو یک چیزند: torchaudio تازه، خواندن و نوشتنِ صوت را به
      # `torchcodec` سپرده و torchcodec به **کتابخانه‌های اشتراکیِ** ffmpeg
      # نیاز دارد (libavutil و…)، نه به یک باینری. باینریِ استاتیکِ
      # imageio-ffmpeg — که در tools/render.js بس بود چون آنجا فقط
      # فرمانِ ffmpeg صدا زده می‌شود — اینجا بس نیست.
      #
      # پس این‌بار از خودِ سیستم: هم باینری روی PATH می‌آید، هم libها.
      # چند ده ثانیه گران‌تر است و دو موتور را با هم باز می‌کند.
      - name: ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          # هرچند apt نصبش کرد، مسیرِ libها را هم می‌گوییم تا torchcodec
          # مطمئن پیدایشان کند.
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: گرفتنِ فایل‌ها از درایو
        env:
          REF_ID: ${{ inputs.ref_id }}
          SRC_ID: ${{ inputs.src_id }}
        run: |
          set -euo pipefail
          # اجرای #۳: کارِ chatterboxvc با کدِ ۲۲ افتاد — یعنی خطای HTTP در
          # همین curl، و پوشهٔ خروجی اصلاً ساخته نشد. چهار کارِ دیگر همان
          # لحظه همان دو فایل را می‌گرفتند: درایو یکی را پس زد. موازی‌کردن
          # را خودم آوردم، پس تلاشِ دوباره هم کارِ من است.
          dl () {
            for i in 1 2 3 4 5; do
              if curl -sSL --fail-with-body -o "$2" \
                   "https://drive.usercontent.google.com/download?id=$1&export=download&confirm=t"; then
                return 0
              fi
              echo "دانلود نشد (تلاشِ $i) — کمی صبر."
              sleep $((i * 7))
            done
            echo "::error::پس از پنج تلاش، فایل $1 از درایو نیامد."
            return 1
          }
          # و کمی پخش‌کردنِ شروع، تا پنج کار هم‌زمان به درایو نزنند.
          sleep $(( (RANDOM % 20) ))
          dl "$REF_ID" ref.input
          # فایلی که خصوصی مانده باشد، HTML برمی‌گرداند نه صوت. این را همان
          # اول می‌گیریم تا خطا در نصبِ مدل گم نشود.
          if file ref.input | grep -qi 'html\|ascii'; then
            echo "::error::فایلِ نمونه خصوصی است. در درایو «هرکس با لینک: بیننده» کنید."
            head -c 300 ref.input; exit 1
          fi
          ls -l ref.input
          if [ -n "${SRC_ID}" ]; then
            dl "$SRC_ID" src.input
            if file src.input | grep -qi 'html\|ascii'; then
              echo "::error::فایلِ مبدأ خصوصی است."; exit 1
            fi
            ls -l src.input
          fi

      - name: اجرای آزمایش
        env:
          LAB_TEXT: ${{ inputs.text }}
          F5_CKPT: ${{ inputs.f5_ckpt }}
          F5_VOCAB: ${{ inputs.f5_vocab }}
          F5_REF_TEXT: ${{ inputs.f5_ref_text }}
          F5_NFE: ${{ inputs.f5_nfe }}
          REF_SECONDS: ${{ inputs.ref_seconds }}
        run: |
          set -euo pipefail
          # با `set -e` نمی‌شود «شرط && کار» نوشت: وقتی شرط نادرست باشد، کلِ
          # جمله کدِ ۱ می‌دهد و پوسته همان‌جا می‌میرد. یعنی اجرا بدونِ src
          # (که حالتِ عادیِ موتورهای TTS است) پیش از شروع شکست می‌خورد.
          ARGS=(--engine "${{ matrix.engine }}" --ref ref.input --out voicelab-out)
          if [ -f src.input ]; then ARGS+=(--src src.input); fi
          if [ -n "${LAB_TEXT}" ]; then ARGS+=(--text "${LAB_TEXT}"); fi
          if [ -n "${F5_CKPT}" ];  then ARGS+=(--f5-ckpt  "${F5_CKPT}");  fi
          if [ -n "${F5_VOCAB}" ]; then ARGS+=(--f5-vocab "${F5_VOCAB}"); fi
          if [ -n "${F5_REF_TEXT}" ]; then ARGS+=(--f5-ref-text "${F5_REF_TEXT}"); fi
          if [ -n "${F5_NFE}" ];      then ARGS+=(--f5-nfe "${F5_NFE}"); fi
          if [ -n "${REF_SECONDS}" ]; then ARGS+=(--ref-seconds "${REF_SECONDS}"); fi
          python3 tools/voicelab.py "${ARGS[@]}"

      # ══ خروجی روی Release نمی‌رود، و این عمدی است ══
      # این ریپو عمومی است و خروجیِ این آزمایش، صدای کلون‌شدهٔ یک شخصِ
      # حقیقی است. یک Releaseِ عمومی یعنی آن صدا برای همیشه روی اینترنت
      # قابلِ دانلود است — و لینکی که عمومی شد، «فردا بهترش می‌کنیم» ندارد.
      # پس فقط artifact، با کوتاه‌ترین نگه‌داری. (اگر ریپو عمومی بماند،
      # artifact هم تا یک روز برای بیننده‌های ریپو در دسترس است؛ برای
      # نمونهٔ کوتاهِ آزمایشی پذیرفتنی است، برای بیشتر از آن نه.)
      - name: بایگانیِ خروجی
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voicelab-${{ matrix.engine }}
          path: voicelab-out/
          retention-days: 1
          if-no-files-found: warn

      # گزارشِ متنی — بی هیچ صدایی — در سیاههٔ اجرا، تا بشود بی دانلود خواند.
      - name: چکیده در سیاهه
        if: always()
        run: |
          set -euo pipefail
          for f in voicelab-out/report-*.json; do
            [ -e "$f" ] || continue
            echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
