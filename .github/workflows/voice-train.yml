# آموزشِ صدای رضوی — روی ماشینی که دستِ خودمان است
#
# ══ چرا اینجا ══
# Colab به مرورگرِ بازِ کاربر وابسته بود و اتصالش هر چند دقیقه می‌افتاد.
# Kaggle چهار بار «Canceled by backend. Exit code: 137» داد، هر بار در
# نقطهٔ دیگری — بعد از وزن‌ها، سرِ دانلود، سرِ ساختِ دیتاست، وسطِ pip — و
# هر فرضیه‌ای با عدد رد شد (رم ۰٫۴ تا ۲٫۴ گیگ از ۳۰؛ دیسک همیشه بیش از
# ۱۹ گیگ آزاد؛ پوشهٔ خروجی در آخرین اجرا یک فایلِ صفرمگابایتی). یعنی
# هیچ‌کدام را کدِ ما نکُشت.
#
# وقتی سکو هیچ شاهدی نمی‌دهد، مسئله «فرضیهٔ بعدی» نیست — مسئله این است
# که ماشین دستِ تو نیست. اینجا هست.
#
# ══ بهایش، صادقانه ══
# رانر GPU ندارد. آموزش روی CPU همان کار را می‌کند و چند برابر کندتر.
# ولی چون کسی پایش ننشسته، کندی فقط یعنی «فردا به‌جای امشب»: هر شش
# ساعت یک job راه می‌افتد، تا پنج ساعت کار می‌کند، و از همان‌جا که
# ماند ادامه می‌دهد. کاربر هیچ کاری نمی‌کند.
#
# ══ پیش‌شرط ══
# چهار ضبطِ درایو باید «هر کسی با لینک: بیننده» بمانند — رانر با هویتِ
# هیچ‌کس وارد می‌شود. شناسه‌ها در `tools/voicetrain.py` هستند.
#
# ══ نتیجه ══
# وقتی تمام شد، در تبِ Actions همان اجرا یک artifact به نامِ
# `voice-razavi` دارد: مدل و ایندکس. همان دو فایلی که موتور می‌خواهد.

name: voice-train

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'چند دور آموزش — با دیتاستِ ۲۴۰ دقیقه‌ای ۳۲ دور همان تعدادِ گامِ ۲۰۰ دور روی ۳۹ دقیقه است'
        required: false
        default: '32'
      allow_fresh:
        description: 'اگر کشِ اجرای پیشین نبود، از صفر شروع کن (پیش‌فرض: نه — اجرا می‌ایستد تا کارِ قبلی دور ریخته نشود)'
        required: false
        default: 'false'
      voice:
        description: 'کلیدِ گوینده — لاتین و کوتاه (مثلِ razavi). کشِ کار، نامِ وزن‌ها و artifact از همین ساخته می‌شوند؛ پس دو گوینده هرگز کشِ هم را نمی‌گیرند.'
        required: false
        default: 'razavi'
      file_ids:
        description: 'شناسه‌های درایوِ ضبط‌ها، با کاما. خالی = همان هشت ضبطِ رضوی. فایل‌ها باید «هر کسی با لینک» باشند.'
        required: false
        default: ''
  # ══ زمان‌بندی برداشته شد (۱۸ سپتامبر) — چون کار تمام شد ══
  # آموزش به هدفش رسید: «دورِ ۳۲ از ۳۲ · تمام‌شده: True» (اجرای ۵۹).
  # ولی زمان‌بندیِ `17 */6 * * *` سرِ جایش ماند، و از آن به بعد هر شش
  # ساعت یک اجرا راه می‌افتاد که:
  #   • مرحلهٔ «آموزش» در دو ثانیه با خطا تمام می‌شد (اجراهای ۶۰، ۶۱، ۶۲)
  #   • و با این حال ۱۹۲ مگابایت artifact را دوباره بالا می‌فرستاد.
  # کامنتِ قبلی می‌گفت «به هدف که رسید هر اجرا در چند ثانیه تمام می‌شود» —
  # درست، جز اینکه **قرمز** تمام می‌شود. یک گردش‌کارِ زمان‌بندی‌شده که هر
  # شش ساعت شکست می‌خورد، همان هشداری است که آدم یاد می‌گیرد نادیده‌اش
  # بگیرد؛ و اگر روزی آموزشِ واقعی بشکند، بینِ این خطاها گم می‌شود.
  #
  # برای ادامهٔ آموزش (هدفِ بالاتر، یا دیتاستِ تازه): همین گردش‌کار را
  # دستی راه بینداز — `epochs` را بگذار و برو. کش و `state.json` سرِ
  # جایشان‌اند، پس از همان‌جا که بود ادامه می‌دهد.

  # ══ تاریخچه ══
  # هشت اجرا (۶ سپتامبر ۲۰۲۶): ۶۰ دور، ۲۶ ساعت آموزشِ خالص روی CPU،
  # ۲۶ دقیقه هر دور. اجرای هشتم زودتر از بودجه‌اش ایستاد — نشانهٔ
  # رسیدن به هدف، نه شکست — و artifact از ۹ به ۲۳۱ مگابایت رفت.
  #
  # کرانی که کارش تمام شده و هر شش ساعت اجرا می‌شود، هر بار ۲۳۱
  # مگابایت artifact می‌سازد برای هیچ. ادامهٔ آموزش هنوز ممکن است:
  # دستی اجرا کنید با عددِ بزرگ‌تر در `epochs` — کش سرِ جایش است و
  # از همان چک‌پوینت ادامه می‌دهد.

concurrency:
  # ══ دو job همزمان یعنی دو کش که همدیگر را خراب می‌کنند ══
  #
  # ۸ سپتامبر شاهدش را داد: اجرای ۲۰ در ۱۱:۱۵:۵۵ ساخته شد، بیست‌وچهار
  # دقیقه پیش از آنکه اجرای ۱۹ تمام شود — و jobش در ۱۱:۳۹:۱۶ شروع کرد،
  # درست پس از پایانِ ۱۹ و پس از نوشته‌شدنِ کشش در ۱۱:۳۹:۰۵. یعنی صف
  # کار کرد و کش سالم رسید. (اول این را «یازده ثانیه شانس» خواندم و یک
  # گروهِ دومِ هم‌نام اضافه کردم؛ کلیدِ تکراری کلِ فایل را برای گیت‌هاب
  # نامعتبر کرد و هفت ساعت هیچ اجرایی راه نیفتاد. پیش از افزودنِ یک
  # سازوکار، ببین همان سازوکار از قبل هست یا نه.)
  # ══ گروه به گوینده بسته است (۷٫۲۱) ══
  # تا اینجا گروه یک نام بود، پس آموزشِ گویندهٔ دوم پشتِ گویندهٔ اول در
  # صف می‌ماند — بی هیچ دلیلِ فنی، چون کش و artifact و پوشهٔ کارشان از
  # هم جداست. حالا هر گوینده صفِ خودش را دارد: دو نفر می‌توانند هم‌زمان
  # آموزش ببینند، و دو اجرای **یک** گوینده همچنان صف می‌شوند — که همان
  # چیزی است که این گروه از روزِ اول برایش گذاشته شد (دو job هم‌زمان یعنی
  # دو کش که همدیگر را خراب می‌کنند).
  group: voice-train-${{ github.event.inputs.voice || 'razavi' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: جا باز کن
        # رانر ۱۴ گیگ دیسک دارد و بخشِ زیادی‌اش صرفِ ابزارهایی است که
        # ما یکی‌شان را هم به کار نمی‌بریم. ویژگی‌های استخراج‌شده چند
        # گیگ‌اند؛ «no space left» وسطِ آموزش یعنی یک اجرای هدررفته.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: ffmpeg
        # ══ ubuntu-latest دیگر ffmpeg ندارد ══
        # `dsprep.ffmpeg()` اول باینریِ سیستم را می‌خواهد. بستهٔ
        # `imageio-ffmpeg` هم نصب می‌شود (فهرستِ خودِ ماژول)، ولی وقتی
        # باینریِ واقعی روی PATH باشد هر مسیرِ دیگری هم که روزی به آن
        # نیاز پیدا کند کار می‌کند — نه فقط مسیری که امروز می‌شناسیم.
        run: sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1

      # ══ دو کش، چون یک کشِ ۹٫۲ گیگی هیچ نسخهٔ پشتیبانی نمی‌گذارد ══
      #
      # سقفِ کشِ هر مخزن ۱۰ گیگابایت است. تا امروز همهٔ `~/rvcwork` در یک
      # کش بود و هر اجرا از نو نوشته می‌شد: یعنی فقط **یک** نسل جا می‌شد،
      # هر ذخیره قبلی را بیرون می‌انداخت، و یک بار نیافتن یعنی همه‌چیز.
      # ۱۲ سپتامبر دقیقاً همین شد و بیست‌وسه دورِ آموزش از بین رفت.
      #
      # حالا کار به دو دسته تقسیم می‌شود، به یک معیار: **بازساختنی یا نه.**
      #
      #   الف) سنگین و بازساختنی — ویژگی‌های استخراجی و وزن‌های پایه. اگر
      #        گم شود دو ساعت‌ونیم دوباره ساخته می‌شود.
      #
      #        ══ و اینجا تخمین غلط بود، پس عدد گذاشته شد ══
      #        اجرای ۴۱ اندازه‌ها را داد: پایه **۹٫۰۹ گیگ** شد، نه «حدودِ
      #        هفت» که حدس زده بودم، و چک‌پوینت‌ها ۱٫۲۷ — جمعاً ۱۰٫۳۶ روی
      #        سقفِ ۱۰. یعنی تقسیم انجام شده بود ولی حاشیه‌ای که هدفش بود
      #        نساخته بود. پس `raw`, `dataset` و `1_16k_wavs` هم بیرون
      #        رفتند: آموزش فهرستش را فقط از `0_gt_wavs`، `3_feature768`،
      #        `2a_f0` و `2b-f0nsf` می‌سازد، و آن سه فقط **ورودیِ ساختِ**
      #        همین‌هایند. `featsReady_` در `tools/voicetrain.py` همین را
      #        می‌داند، پس نبودنشان دیگر باعثِ دانلودِ دوبارهٔ هشت ضبط
      #        نمی‌شود. کلیدش تا **ورودی** عوض نشود همان می‌مانَد، پس
      #        یک بار نوشته می‌شود و دیگر هرگز — و چیزی که نوشته نمی‌شود،
      #        چیزی را از سقف بیرون نمی‌اندازد.
      #        و چون هر اجرا برمی‌گرداندش، «تازه استفاده‌شده» می‌مانَد و
      #        خودش هم بیرون انداخته نمی‌شود.
      #
      # و `raw` (ضبط‌های خام، ~۲۰۰ مگ) از ۱۴ سپتامبر **داخلِ** پایه است.
      # اول بیرونش گذاشتم چون «میان‌بُر» است — درست، ولی معیار اشتباه بود:
      # اندازه‌اش ناچیز است و هزینه‌اش گوگل‌درایو. اجرای ۴۶ روی ضبطِ هفتم
      # افتاد با «have had many accesses» — سهمیهٔ درایو، چون هر بازسازیِ
      # پایه هر هشت فایل را دوباره می‌کشید. چیزی که ارزان است و بیرون
      # آوردنش یک وابستگیِ بیرونی را هر بار صدا می‌زند، باید بمانَد.
      #
      #   ب) سبک و بازساختنی‌نیست — چک‌پوینت‌های G و D، نردبانِ وزن‌های هر
      #        دور، ایندکس، و state. دو-سه گیگ، هر اجرا نوشته می‌شود. حالا
      #        چون فقط همین مقدار می‌چرخد، دو-سه نسل کنارِ هم جا می‌شوند و
      #        نیافتنِ یکی، پایانِ کار نیست.
      #
      # ══ و دستهٔ الف **مثبت** فهرست می‌شود، نه با کنار گذاشتن ══
      # اولش «هرچه هست، منهای آنچه ب دارد» بود، با این استدلال که نامِ
      # درونیِ RVC ممکن است عوض شود. استدلال خوب بود؛ فقط کار نمی‌کرد.
      # عددها در اجرای ۴۵ حکم دادند: کلِ درخت روی دیسک ۱۱ گیگ است و کشِ
      # «فیلترشدهٔ» پایه ۱۰٫۱۱ گیگِ **فشرده** درآمد. اگر کنارگذاشتن‌ها
      # گرفته بودند، حداکثر ~۷٫۷ گیگ خام می‌مانْد و فشرده‌اش از آن کمتر —
      # پس هیچ‌کدام از آن خط‌های `!` هرگز چیزی را کنار نگذاشته بود. کل
      # ماجرا از روزِ اول یک کشِ تمام-درخت بود با شش خطِ بی‌اثر بالایش.
      #
      # پس حالا فقط همان چیزهایی فهرست می‌شوند که `rvcpipe.preTrain_`
      # واقعاً می‌خواند (چهار پوشه، برای هر دو گویندهٔ `razavi` و `mute`
      # با یک `*`) به‌علاوهٔ وزن‌های پایه. الگوی مثبت در همین فایل ثابت
      # شده که کار می‌کند — کشِ چک‌پوینت‌ها با همین شکل هر بار درست
      # برمی‌گردد. یک سازوکارِ اثبات‌شده بهتر از یک استدلالِ درست است.

      # ══ کلیدِ پایه به **ورودی** بسته است، نه به یک عددِ دستی ══
      # `dsSig_()` همان تابعی است که خودِ کد با آن تصمیم می‌گیرد دیتاست
      # را از نو بسازد یا نه. اگر کلیدِ کش یک `-v1`ِ دست‌نویس بود، روزی
      # که ضبطِ تازه‌ای اضافه شود کد دیتاست را درست از نو می‌ساخت و کش
      # تا ابد نسخهٔ کهنه را برمی‌گرداند — و هیچ‌کس یادش نمی‌مانْد که
      # عدد را دستی جلو ببرد. یک منبع، نه دو.
      # ══ ورودیِ فرم دستِ آدم است، پس بی‌صدا نباید تفسیر شود ══
      # `voicetrain.py` رشته را پاک‌سازی می‌کند ولی کلیدهای کش و نامِ
      # artifact در همین فایل رشتهٔ **خام** را می‌گیرند. یعنی اگر کسی
      # «بهروز رضوی» تایپ کند، پوشهٔ وزن‌ها `logs/razavi/` می‌شود و کش و
      # artifact نامِ فارسی می‌گیرند — دو نام برای یک چیز، همان چیزی که
      # کامنتِ خودِ voicetrain.py ممنوعش می‌کند. موتور هرگز چنین کلیدی
      # نمی‌سازد؛ آدم می‌سازد. پس بلند می‌ایستیم.
      - name: کلیدِ گوینده سالم است؟
        env:
          RAW: ${{ github.event.inputs.voice || 'razavi' }}
        run: |
          set -euo pipefail
          CLEAN="$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]' \
                   | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//' | cut -c1-40)"
          if [ "$RAW" != "$CLEAN" ]; then
            echo "::error title=کلیدِ گوینده::«$RAW» کلیدِ معتبری نیست. کلید باید لاتینِ کوچک، رقم و خط‌تیره باشد (مثلاً «$CLEAN»). موتور خودش کلیدِ درست را در صف می‌گذارد؛ اگر دستی اجرا می‌کنی، همان را بردار."
            exit 1
          fi
          [ -n "$CLEAN" ] || { echo "::error::کلیدِ گوینده خالی است."; exit 1; }
          echo "کلید: $CLEAN"

      - name: اثرِ انگشتِ ورودی
        id: sig
        env:
          # ══ همین دو خط، وگرنه اثرِ انگشت مالِ رضوی است و آموزش مالِ نفرِ دیگر ══
          # `dsSig_()` از `VOICE` و `DRIVE_IDS` ساخته می‌شود، و هر دو از
          # محیط می‌آیند. اگر این مرحله بی محیط اجرا شود، کلیدِ کش مالِ
          # رضوی می‌شود و دیتاستِ او برای گویندهٔ تازه «موجود» شمرده
          # می‌شود — **بی هیچ خطایی**. این تکرارِ محیط در دو مرحله زشت
          # است ولی لازم؛ زشتیِ دیده‌شده بهتر از درستیِ نانوشته است.
          VT_VOICE: ${{ github.event.inputs.voice || 'razavi' }}
          VT_FILE_IDS: ${{ github.event.inputs.file_ids || '' }}
        run: |
          S=$(python -c 'import sys; sys.path.insert(0,"tools"); import voicetrain as V; print(V.dsSig_())')
          echo "اثرِ انگشت: $S"
          echo "sig=$S" >> "$GITHUB_OUTPUT"

      - name: پایهٔ سنگین — دیتاست و ویژگی‌ها (یک‌بار نوشته می‌شود)
        id: cachebase
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/rvcwork/logs/*/0_gt_wavs
            ~/rvcwork/logs/*/3_feature768
            ~/rvcwork/logs/*/2a_f0
            ~/rvcwork/logs/*/2b-f0nsf
            ~/rvcwork/assets/hubert_base
            ~/rvcwork/assets/pretrained_v2
            ~/rvcwork/assets/rmvpe
            ~/rvcwork/raw
          key: rvc-${{ github.event.inputs.voice || 'razavi' }}-base-${{ steps.sig.outputs.sig }}

      - name: کارِ اجرای پیشین را برگردان
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/rvcwork/logs/*/G_*.pth
            ~/rvcwork/logs/*/D_*.pth
            ~/rvcwork/assets/weights
            ~/rvcwork/assets/indices
            ~/rvcwork/out
          key: rvc-${{ github.event.inputs.voice || 'razavi' }}-ckpt-${{ github.run_id }}
          # ══ اینجا کلیدِ مهاجرت **ممکن نیست** ══
          # اول `rvc-razavi-` را هم گذاشته بودم تا کش‌های تک‌تکهٔ پیش از
          # این تغییر برگردند. کار نمی‌کند: شناسهٔ هر کش علاوه بر کلید،
          # از **فهرستِ مسیرها** هم ساخته می‌شود، و restore-key فقط
          # کش‌هایی را می‌بیند که همان شناسه را دارند. کشِ قدیمی مسیرش
          # `~/rvcwork` بود؛ این پنج مسیر است. پس هرگز جور نمی‌شود.
          # نگه داشتنِ آن کلید یعنی یک وعدهٔ دروغ در فایل — همان چیزی که
          # این مخزن بارها بهایش را داده. عبور یک‌بار و دستی است:
          # `allow_fresh: true`، با آگاهی از اینکه دورهای داخلِ کشِ
          # قدیمی از دست می‌روند.
          restore-keys: |
            rvc-${{ github.event.inputs.voice || 'razavi' }}-ckpt-

      # ══ اجرایی که از صفر شروع کند، شبیهِ اجرای عادی است ══
      # ۸ سپتامبر: اجرای ۱۸ لغو شد، کشِ خودش را در ۰۶:۴۵:۰۳ نوشت، و
      # اجرای ۱۹ در ۰۶:۴۷:۳۶ چیزی نگرفت — مرحلهٔ برگرداندن **صفر ثانیه**
      # طول کشید، در حالی که در اجراهای ۱۶ و ۱۷ نود تا صد و هشتاد ثانیه
      # بود. یعنی دو دورِ آموزش (نزدیک پنج ساعت) دود شد، و تنها نشانه‌اش
      # اختلافِ مهرِ زمانیِ دو مرحله بود؛ نه خطایی، نه هشداری، نه خطی در
      # هیچ لاگی.
      #
      # سقفِ کشِ هر مخزن ۱۰ گیگابایت است و هر کشِ اینجا چند گیگ؛ پس
      # نوشتنِ یک کشِ تازه می‌تواند قبلی را بیرون بیندازد و ذخیره‌ای که
      # از سقف رد شود، مرحله را سبز نگه می‌دارد و چیزی نمی‌مانَد.
      # این حالت **عادی نیست** و باید همان‌جا گفته شود، نه اینکه از روی
      # طولِ اجرای مرحله حدس زده شود.
      # ══ و هشدار کافی نبود: باید **بایستد** ══ (۱۳ سپتامبر)
      #
      # ۱۲ سپتامبر ۲۰:۳۵:۵۶ اجرای ۳۹ همین هشدار را داد و بعد کارِ خودش را
      # کرد: دیتاست را از نو ساخت، «آموزش از گامِ ۰» و `razavi_e1`. یعنی
      # **بیست‌وسه دورِ آموزش — نزدیک شصت ساعت — در یک مرحلهٔ سبز دود شد**،
      # و بدتر: همان اجرا کشِ خودش را (با دورِ ۱) ذخیره کرد و آن یکی شد
      # تازه‌ترین، پس اجرای بعدی هم رویش ساخت. هشدار درست فریاد زد و هیچ
      # چیز جلویش را نگرفت.
      #
      # کشِ اجرای ۳۸ (دورِ ۲۳) دو دقیقه پیش‌تر، ۲۰:۳۳:۵۹، نوشته شده بود و
      # پیدا نشد. علتِ ساختاری: هر کش ~۹٫۲ گیگ است و سقفِ مخزن ۱۰ — پس
      # فقط **یک** نسل جا می‌شود و هیچ نسخهٔ پشتیبانی نمی‌مانَد. یک بار
      # نیافتن، یعنی همه‌چیز.
      #
      # آن سقف حالا با کشِ دوتایی حل شده (بالاتر)، ولی قاعده سرِ جایش
      # می‌مانَد — دلیلش هرگز فقط سقف نبود:
      # **اجرایی که کار پیدا نکند حق ندارد از صفر شروع کند.** می‌ایستد،
      # هیچ کشی نمی‌نویسد، و کسی نگاه می‌کند. شروعِ عمدی از صفر فقط با
      # دستِ آدم: `allow_fresh: true` در فرم.
      - name: کارِ پیشین واقعاً برگشت؟
        run: |
          if [ -n "${{ steps.cache.outputs.cache-matched-key }}" ]; then
            echo "کارِ اجرای پیشین برگشت: ${{ steps.cache.outputs.cache-matched-key }}"
            exit 0
          fi
          if [ "${{ github.event.inputs.allow_fresh }}" = "true" ]; then
            echo "::warning title=شروع از صفر::کش نبود، ولی allow_fresh خواسته شده — از صفر شروع می‌شود."
            exit 0
          fi
          echo "::error title=کش برنگشت::کارِ اجرای پیشین برنگشت. این اجرا **متوقف شد** تا دوباره از دورِ ۱ شروع نکند و کشِ خالی ننویسد. اگر واقعاً باید از صفر شروع شود، دستی اجرا کن با allow_fresh=true."
          exit 1

      - name: آموزش
        id: train
        env:
          # ══ این عدد باید همان پیش‌فرضِ خانهٔ فرم باشد ══
          # اجرای زمان‌بندی‌شده هیچ ورودی‌ای ندارد، پس همیشه از این
          # شاخه رد می‌شود — و این شاخه روی ۶۰ مانده بود در حالی که
          # فرم ۲۰۰ می‌گفت. حاصلش این بود: اجرای دستی هدف را ۲۰۰
          # می‌نوشت، و بعد هر سیزده اجرای خودکار با هدفِ ۶۰ می‌آمدند،
          # دروازهٔ «قبلاً رسیده» را می‌دیدند و در چند ثانیه **موفق**
          # تمام می‌شدند. کلِ ادامهٔ آموزش بی هیچ خطایی متوقف می‌ماند.
          # بخشِ ۲۹ خودآزما حالا برابریِ این دو را می‌سنجد.
          VT_EPOCHS: ${{ github.event.inputs.epochs || '32' }}
          VT_BUDGET_MIN: '290'
          VT_VOICE: ${{ github.event.inputs.voice || 'razavi' }}
          VT_FILE_IDS: ${{ github.event.inputs.file_ids || '' }}
        run: python tools/voicetrain.py

      # ══ و اگر ننوشتیم، بلند بگو ══
      # شرطِ پایینی بی‌صدا رد می‌شود. اجرایی که پایه را کامل نکند،
      # اجرای بعدی دو ساعت‌ونیم را دوباره می‌سوزاند — و اگر این هر شب
      # تکرار شود، آموزش هرگز جلو نمی‌رود در حالی که همهٔ اجراها سبزند.
      # شاهد می‌گوید `preprocess`/`extract` تا کجا رسید، پس تکرارش در
      # فهرستِ اجراها دیده می‌شود نه اینکه کسی حدس بزند.
      # (بر اساسِ اجرای ۳۹، ساختِ کاملِ پایه به‌علاوهٔ یک دورِ آموزش در
      # بودجهٔ یک اجرا جا می‌شود؛ پس تکرارِ این هشدار یعنی یک مسئلهٔ
      # تازه، نه حالتِ عادی.)
      # ══ اندازه‌ها را بشمار، حدس نزن ══
      # تخمینِ «حدودِ هفت گیگ» برای پایه غلط بود (۹٫۰۹ شد) و تقسیمِ کش را
      # بی‌اثر کرد. تنها راهِ نگذاشتنِ تکرارش این است که هر اجرا عددِ
      # واقعیِ هر پوشه را چاپ کند — یک ثانیه کار، در برابرِ تصمیمی که بر
      # پایهٔ حدس گرفته می‌شود.
      - name: اندازهٔ هر پوشه
        if: always() && steps.train.conclusion != 'skipped'
        run: |
          cd ~/rvcwork 2>/dev/null || exit 0
          du -sh -- * 2>/dev/null | sort -rh
          # ══ فراخوانیِ جدا، وگرنه صفر می‌دهد ══
          # اولش `du -sh -- * logs/*/` بود و زیرپوشه‌های logs اصلاً چاپ
          # نشدند: du چیزی را که در همان فراخوانی زیرِ یک والدِ شمرده‌شده
          # آمده، دوباره نمی‌شمارد. و `logs` تنها ۸٫۲ از ۱۱ گیگ است، یعنی
          # دقیقاً همان چیزی که باید شکسته شود.
          echo "— داخلِ logs —"
          du -sh -- logs/*/* 2>/dev/null | sort -rh | head -12
          # ══ و داخلِ assets، چون آنجا هم چیزی رشد می‌کند ══
          # نردبانِ `assets/weights/razavi_e<N>.pth` هر دور یک فایل
          # اضافه می‌کند و تنها بخشِ **رشدکنندهٔ** کشِ چک‌پوینت است. تا
          # امروز هرگز شکسته نشد، پس اندازه‌اش فقط حدس بود — و دو بار
          # حدس زدن در همین پرونده غلط از آب درآمد.
          echo "— داخلِ assets —"
          du -sh -- assets/* 2>/dev/null | sort -rh | head -8
          echo "— نردبان —"
          ls -1 assets/weights/*_e*.pth 2>/dev/null | wc -l
          echo "— جمع —"; du -sh . 2>/dev/null

      - name: پایه کامل نشد؟ بلند بگو
        if: always() && steps.train.conclusion != 'skipped' && steps.cachebase.outputs.cache-hit != 'true' && steps.train.outputs.base_ok != 'true'
        run: |
          echo "::warning title=پایه ذخیره نشد::این اجرا پایهٔ سنگین را کامل نکرد، پس در کش نرفت و اجرای بعدی دوباره می‌سازدش. اگر این پیام دو اجرای پشتِ‌سرِهم بیاید، ساختِ پایه در بودجهٔ یک اجرا جا نمی‌شود و باید نگاه شود."

      # ══ پایه را یک بار بنویس، و فقط وقتی کامل است ══
      # دو شرط، و هر دو لازم‌اند:
      #   • `cache-hit != 'true'` — اگر از قبل هست، دست نزن. کشی که
      #     نوشته نمی‌شود، چیزی را از سقفِ ۱۰ گیگ بیرون نمی‌اندازد؛ و
      #     چون هر اجرا برمی‌گرداندش، «تازه استفاده‌شده» می‌مانَد و خودش
      #     هم بیرون انداخته نمی‌شود.
      #   • `base_ok == 'true'` — شاهدِ کامل بودن، شمرده شده در
      #     `baseReady_`: هر دو وزنِ پایه، دیتاستِ ناخالی، و یک ویژگی به
      #     ازای **هر** تکهٔ ۱۶k. یک کشِ یک‌بارنوشت که نیمه‌کاره پر شود،
      #     تا ابد نیمه‌کاره می‌مانَد.
      # و چون این خروجی فقط وقتی نوشته می‌شود که آموزش تا آخر برسد، هر
      # شکستِ دیگری شرط را تهی می‌گذارد — یعنی «نه». پیش‌فرضِ درست.
      - name: پایهٔ سنگین را نگه دار — اگر نبود و اگر کامل است
        if: always() && steps.cachebase.outputs.cache-hit != 'true' && steps.train.outputs.base_ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/rvcwork/logs/*/0_gt_wavs
            ~/rvcwork/logs/*/3_feature768
            ~/rvcwork/logs/*/2a_f0
            ~/rvcwork/logs/*/2b-f0nsf
            ~/rvcwork/assets/hubert_base
            ~/rvcwork/assets/pretrained_v2
            ~/rvcwork/assets/rmvpe
            ~/rvcwork/raw
          key: rvc-${{ github.event.inputs.voice || 'razavi' }}-base-${{ steps.sig.outputs.sig }}

      # ══ نردبان: اول بایگانی، بعد کوتاه ══
      # کشِ چک‌پوینت تنها یک بخشِ رشدکننده دارد —
      # `assets/weights/<voice>_e<N>.pth`، هر دور یکی. و سقفِ ۱۰ گیگ در
      # **لحظهٔ ذخیره** سنجیده می‌شود، جایی که نسلِ کهنه و تازه هر دو
      # هستند: `پایه + ۲×چک‌پوینت`. پس هر گیگِ نردبان دو گیگ از سقف
      # می‌خورَد، و وقتی رد شد کهنه‌ترین کش می‌رود — یعنی پایه، چون
      # یک‌بار نوشته می‌شود و هرگز تازه نمی‌شود. اجرای ۵۱ همین بود.
      #
      # ولی این عکس‌ها بی‌خود ساخته نشده‌اند: از جایی به بعد مدل به‌جای
      # یاد گرفتنِ گوینده داده را حفظ می‌کند، و یافتنِ آن نقطه فقط با
      # مقایسهٔ همین نسخه‌ها ممکن است. پس پاک نمی‌شوند — **جا عوض
      # می‌کنند**: artifactها از سقفِ کش حساب نمی‌شوند.
      #
      # و ترتیب، شرطِ درستیِ کار است. حذف به `outcome == 'success'`ِ
      # بارگذاری بسته است، چون حذفی که بایگانی‌اش نرفته باشد برنمی‌گردد.
      # ۹۰ روز نگه‌داری، چون مقایسه پس از **پایانِ** آموزش انجام می‌شود
      # نه حالا؛ ۳۰ روزِ artifactِ معمولی ممکن است زودتر تمام شود.
      - name: نردبان را بایگانی کن — پیش از کوتاه کردنش
        id: ladder
        if: always() && steps.train.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: voice-${{ github.event.inputs.voice || 'razavi' }}-ladder-${{ github.run_number }}
          path: ~/rvcwork/assets/weights/*_e*.pth
          if-no-files-found: ignore
          retention-days: 90

      - name: و حالا کوتاهش کن — فقط بالاترین می‌مانَد
        if: always() && steps.train.conclusion != 'skipped' && steps.ladder.outcome == 'success'
        env:
          # ══ هر مرحله‌ای که voicetrain را import می‌کند، باید گوینده را
          # همراه داشته باشد ══
          # `ladderPrune_` روی `^<VOICE>_e<N>` تطبیق می‌دهد و `VOICE` سرِ
          # import از محیط خوانده می‌شود. بی این دو خط، اینجا همیشه
          # «razavi» بود، پس برای هر گویندهٔ دیگری **صفر** عکس هرس می‌شد
          # — سبز، بی‌خطا، و با پیامِ «نردبان کوتاه شد: ۰». نتیجه‌اش
          # ترکیدنِ سقفِ ۱۰ گیگیِ کش (۳۲ عکس × ۵۳ مگ) و بیرون افتادنِ
          # پایهٔ ۶٫۹۴ گیگی، یعنی ۵۲ دقیقه ساخت از نو — همان شکستِ
          # اجرای ۵۱ که این تابع برای جلوگیری‌اش نوشته شد.
          VT_VOICE: ${{ github.event.inputs.voice || 'razavi' }}
          VT_FILE_IDS: ${{ github.event.inputs.file_ids || '' }}
        run: |
          W="$HOME/rvcwork"
          echo "— نردبان، پیش —"; du -sh "$W/assets/weights" 2>/dev/null || true
          python - "$W" <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import voicetrain as V
          gone = V.ladderPrune_(sys.argv[1])
          print("نردبان کوتاه شد: %d عکسِ میانی رفت (بایگانی‌شان بالا رفت)"
                % len(gone))
          PY
          echo "— نردبان، پس —"; du -sh "$W/assets/weights" 2>/dev/null || true
          ls -1 "$W"/assets/weights/*_e*.pth 2>/dev/null || true

      # ══ عدد از روی دیسک، پیش از کش و پیش از artifact ══
      # `state.json` را پایانِ `voicetrain.py` می‌نویسد. اجرای ۶۷ (۲۳
      # سپتامبر) دورِ ۶ را تمام و ذخیره کرد و بعد گیت‌هاب job را لغو کرد؛
      # فرآیند هرگز به آن خط نرسید، پس فایلِ **اجرای پیشین** (دورِ ۵) هم
      # در کش ماند و هم به‌عنوانِ نتیجهٔ این اجرا بارگذاری شد — و
      # `voiceintake.py` روی همان تصمیم می‌گیرد. `epochsDone_` عدد را از
      # عکس‌های `<VOICE>_e<N>.pth` می‌خوانَد، یعنی از چیزی که آموزش خودش
      # نوشته. این مرحله `always()` است، درست مثلِ ذخیرهٔ کش، چون
      # نیمه‌کاره ماندن حالتِ **عادی** این گردش‌کار است.
      - name: وضعیت را از روی دیسک بنویس
        if: always() && steps.train.conclusion != 'skipped'
        env:
          VT_VOICE: ${{ github.event.inputs.voice || 'razavi' }}
          VT_EPOCHS: ${{ github.event.inputs.epochs || '32' }}
        run: |
          python - "$HOME/rvcwork" <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import voicetrain as V
          st = V.stateSync_(sys.argv[1])
          print("وضعیت از روی دیسک: دورِ %s از %s · گامِ %s · تمام‌شده: %s"
                % (st["epochs_reached"], st["epochs_target"],
                   st["steps"], st["done"]))
          PY

      - name: کار را برای اجرای بعدی نگه دار
        # ══ همیشه، حتی وقتی قدم نیمه‌کاره ماند ══
        # نیمه‌کاره ماندن حالتِ **عادی** این گردش‌کار است، نه خطا. اگر
        # کش فقط در حالتِ موفق ذخیره شود، هر اجرا از صفر شروع می‌کند و
        # هیچ‌وقت به آخر نمی‌رسد.
        # `always()` عمدی بود (نیمه‌کاره ماندن حالتِ عادی است)، ولی
        # `success() || failure()` کافی نیست: وقتی نگهبانِ کش اجرا را
        # می‌خوابانَد، هیچ کارِ تازه‌ای نیست و نوشتنِ کشِ خالی همان کاری
        # است که ۱۲ سپتامبر بیست‌وسه دور را دور ریخت. پس فقط وقتی
        # ذخیره کن که مرحلهٔ آموزش واقعاً شروع شده باشد.
        if: always() && steps.train.conclusion != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/rvcwork/logs/*/G_*.pth
            ~/rvcwork/logs/*/D_*.pth
            ~/rvcwork/assets/weights
            ~/rvcwork/assets/indices
            ~/rvcwork/out
          key: rvc-${{ github.event.inputs.voice || 'razavi' }}-ckpt-${{ github.run_id }}

      - name: نتیجه
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-${{ github.event.inputs.voice || 'razavi' }}
          path: ~/rvcwork/out
          if-no-files-found: warn
          retention-days: 30

      # ══ آخرین خطِ لاگ، عمداً ══
      # پرسشِ روزمرهٔ این گردش‌کار یکی است: «دورِ چندم؟» — و تا امروز
      # جوابش وسطِ لاگ بود، پشتِ چند صد خطِ «Sent N of N»ِ بارگذاریِ کش.
      # APIِ لاگ فقط دُم می‌دهد و آن دُم را همان پیشرفتِ بارگذاری پر
      # می‌کند، پس هر وارسی چند بار لاگ را می‌کشید تا یک عدد پیدا کند.
      # یک خط، آخر از همه: عددی که هر روز خوانده می‌شود باید آخرین چیزی
      # باشد که چشم می‌بیند — همان قاعده‌ای که `finish_` در کد رعایت
      # می‌کند، اینجا هم رعایت شود.
      - name: خلاصه
        if: always()
        run: |
          S="$HOME/rvcwork/out/state.json"
          [ -f "$S" ] || { echo "خلاصه: state.json نیست"; exit 0; }
          python - "$S" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          print("خلاصه: دورِ %s از %s · گامِ %s · تمام‌شده: %s"
                % (d.get("epochs_reached"), d.get("epochs_target"),
                   d.get("steps"), d.get("done")))
          PY
