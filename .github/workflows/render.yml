# رندرِ ویدئوی یوتیوب — کاری که موتور نمی‌تواند
#
# یوتیوب صوت نمی‌گیرد، ویدئو می‌گیرد؛ و Apps Script نه ffmpeg دارد نه مهلتِ
# کافی. سشن‌های ابری هم چاره نبودند: از آن محیط‌ها drive.google.com اصلاً باز
# نمی‌شود و ابزارهای MCP محتوا را داخلِ گفت‌وگو می‌آورند (صوتِ یک قسمت ۳۰
# مگابایت است). این‌جا هر دو هست: شبکهٔ باز و ffmpeg.
#
# هیچ رمزی لازم نیست. موتور صوت و کاورِ همان قسمت را موقتاً «هرکس با لینک:
# فقط دیدن» می‌کند و نشانی‌شان را در صف می‌گذارد؛ این کار می‌سازد و در
# docs/renders.json می‌نویسد؛ موتور برمی‌دارد و اشتراک را پس می‌گیرد.

name: render-youtube-video

on:
  schedule:
    # ۸.۵۵: «هر ساعت، دقیقهٔ ۴۰» در عمل هر ۳ تا ۹ ساعت اجرا شد — گیت‌هاب کرانِ
    # زمان‌بندی‌شده را زیرِ بار جا می‌اندازد. ویدئوی درسِ ۴۰ ساعت‌ها منتظر ماند.
    # هر ده دقیقه (نه سرِ ساعت، که شلوغ‌ترین لحظه است)، و هر اجرای بی‌کار فقط
    # پروب است: یک خواندنِ صف، چند ثانیه — ffmpeg و قلم فقط وقتی کاری هست.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # دو اجرای هم‌زمان یعنی دو بار رندرِ یک قسمت و برخورد روی docs/renders.json
  group: render-youtube-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      # پروب: همان تعریفِ «کاری هست» که خودِ ساخت دارد (itemsTodo و
      # plCoversTodo در tools/render.js) — دو تعریف یعنی روزی یکی «نه» بگوید
      # و دیگری کار داشته باشد. بی‌نیاز به هیچ نصبی.
      - name: پروب — کاری هست؟
        id: probe
        run: node tools/render.js --probe

      # ubuntu-latest دیگر ffmpeg ندارد. باینریِ استاتیکِ PyPI در چند ثانیه
      # می‌آید و به sudo هم نیازی ندارد.
      - name: ffmpeg
        if: steps.probe.outputs.work == '1'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet imageio-ffmpeg
          FF="$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          # بدون pipefail، «ffmpeg -version | head -1» کدِ خروجیِ head را
          # می‌دهد و نبودِ ffmpeg سبز رد می‌شود. یک بار همین شد.
          "$FF" -version | head -1
          mkdir -p "$HOME/.local/bin"
          ln -sf "$FF" "$HOME/.local/bin/ffmpeg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # کارت‌های ویدئو از ۸.۰۱ این‌جا کشیده می‌شوند، نه در اسلایدز: بافت،
      # خطِ دست‌کشیده، هایلایتر و ظاهرشدنِ تدریجی از پنج شکلِ اسلایدز درنمی‌آید.
      # کروم روی رانر هست؛ فقط قلمِ فارسی نیست و بی آن متن مربع می‌شود —
      # پس نصبش اینجا یک مرحلهٔ **لازم** است، نه آرایشی.
      - name: قلمِ فارسی
        if: steps.probe.outputs.work == '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-core
          fc-list :lang=fa | head -3
          test "$(fc-list | grep -ci 'NotoSansArabic')" -gt 0
          # ۸.۴۵: نوشتهٔ رویِ نقاشی با چند قلم — وزیرمتن (متن)، لاله‌زار (تیترِ درشت).
          # نبودنشان کار را نمی‌خواباند: زنجیرهٔ قلم به نوتو برمی‌گردد. پس شکست
          # در دریافت **گفته** می‌شود و ادامه می‌دهد، نه اینکه ویدئو را بگیرد.
          mkdir -p ~/.fonts
          for u in ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf ofl/lalezar/Lalezar-Regular.ttf; do
            curl -fsSL --max-time 40 -o ~/.fonts/"$(basename "$u" | sed 's/%5B/[/;s/%5D/]/')" \
              "https://raw.githubusercontent.com/google/fonts/main/$u" || echo "::warning::قلمِ $u نیامد؛ نوتو به‌جایش"
          done
          fc-cache -f >/dev/null 2>&1 || true
          fc-list | grep -i -E 'vazirmatn|lalezar|nastaliq' | head -4 || true

      - name: ساختِ ویدئوها
        if: steps.probe.outputs.work == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/render.js

      - name: ثبتِ نشانی‌ها در ریپو
        if: steps.probe.outputs.work == '1'
        run: |
          if git diff --quiet -- docs/renders.json; then
            echo "چیزی عوض نشد."
            exit 0
          fi
          git config user.name  "content-engine-render"
          git config user.email "actions@users.noreply.github.com"
          git add docs/renders.json
          git add docs/brand 2>/dev/null || true     # نشانِ بی‌زمینه برای واترمارک (۸.۴۵)
          git commit -m "رندر: نشانیِ ویدئوهای تازه"
          # اجرای دیگری ممکن است همین بین چیزی push کرده باشد
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 3))
          done
          exit 1
